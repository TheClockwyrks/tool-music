[package]
name = "test-cabinet-music"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "The music binary a run image carries to sequence notes on instrument tracks, one operation at a time, into a .wav and a portable .mid score."

# The `music` binary: a symbolic sequencer (`asset_kind = "music"`) — notes on
# instrument tracks over a tempo and meter, rendered to a PCM `.wav` and emitted
# alongside a portable `.mid` score. A thin CLI over `test-cabinet-audio-core` (the
# DSP, mixer, render engine, and preview renderers); its run-container image
# additionally bakes in an instrument bank. See
# https://docs.testcabinet.ai/testing/asset-generation/audio-binaries/.
[[bin]]
name = "music"
path = "src/main.rs"

[dependencies]
test-cabinet-audio-core = { workspace = true }
clap = { workspace = true }

[lints]
workspace = true
